<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Dashboard</title>
  <style>
    :root {
      --primary-color: #3b82f6;
      --danger-color: #ef4444;
      --success-color: #10b981;
      --text-color: #1e293b;
      --bg-color: #f8fafc;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      margin: 0;
      padding: 20px;
      color: var(--text-color);
    }
    .container {
      max-width: 1400px;
      margin: 0 auto;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
    }
    h1 {
      color: var(--primary-color);
      margin: 0;
      font-size: 2.5rem;
    }
    .logout-btn {
      background-color: var(--danger-color);
      padding: 10px 20px;
      border-radius: 5px;
      color: white;
      text-decoration: none;
      transition: opacity 0.3s;
    }
    .logout-btn:hover {
      opacity: 0.9;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background-color: white;
      box-shadow: 0 1px 15px rgba(0,0,0,0.1);
      border-radius: 12px;
      overflow: hidden;
    }
    th, td {
      padding: 15px;
      text-align: center;
      transition: all 0.3s ease;
    }
    th {
      background: linear-gradient(135deg, #6366f1, #3b82f6);
      color: white;
      font-weight: 600;
      text-transform: uppercase;
      font-size: 0.9em;
    }
    tr:nth-child(even) {
      background-color: #f8f9fa;
    }
    tr:hover {
      background-color: #f1f5f9;
      transform: scale(1.02);
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }
    img.profile-img {
      border-radius: 50%;
      border: 3px solid #e2e8f0;
      width: 50px;
      height: 50px;
      object-fit: cover;
      transition: transform 0.3s ease;
    }
    img.profile-img:hover {
      transform: scale(1.1);
    }
    .timestamp {
      color: #64748b;
      font-size: 0.9em;
    }
    .loading {
      text-align: center;
      padding: 20px;
      font-size: 1.2em;
      color: #64748b;
    }
    /* Modal Styles */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    .modal-content {
      background: white;
      padding: 30px;
      border-radius: 10px;
      width: 400px;
      box-shadow: 0 0 20px rgba(0,0,0,0.2);
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: 600;
    }
    input {
      width: 100%;
      padding: 8px;
      border: 1px solid #ddd;
      border-radius: 4px;
      margin-bottom: 5px;
    }
    .button-group {
      margin-top: 20px;
      display: flex;
      gap: 10px;
    }
    button {
      padding: 10px 20px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .btn-primary {
      background: var(--primary-color);
      color: white;
    }
    .btn-danger {
      background: var(--danger-color);
      color: white;
    }
    .error-message {
      color: var(--danger-color);
      font-size: 0.9em;
      margin-top: 5px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Admin Dashboard 👨💼</h1>
      <a href="#" class="logout-btn" onclick="logout()">Logout</a>
    </div>
    
    <div class="loading" id="loading">Loading users...</div>
    <table>
      <thead>
        <tr>
          <th>Profile</th>
          <th>First Name</th>
          <th>Last Name</th>
          <th>CNIC No</th>
          <th>Email</th>
          <th>Role</th>
          <th>Created At</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="userTable">
        <!-- User data will be populated here -->
      </tbody>
    </table>
  </div>

  <!-- Password Change Modal -->
  <div id="passwordModal" class="modal">
    <div class="modal-content">
      <h2>Change Password</h2>
      <form id="passwordForm">
        <div class="form-group">
          <label>New Password:</label>
          <input type="password" id="newPassword" required>
        </div>
        <div class="form-group">
          <label>Confirm New Password:</label>
          <input type="password" id="confirmPassword" required>
        </div>
        <div class="form-group">
          <label>Admin Password:</label>
          <input type="password" id="adminPassword" required>
        </div>
        <div id="errorMessage" class="error-message"></div>
        <div class="button-group">
          <button type="submit" class="btn-primary">Change Password</button>
          <button type="button" class="btn-danger" onclick="closeModal()">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    let currentUserId = null;
    let authToken = localStorage.getItem('adminToken');

    // Check authentication on load
    if (!authToken) {
      redirectToLogin();
    }

    function redirectToLogin() {
      window.location.href = '/login.html';
    }

    function logout() {
      localStorage.removeItem('adminToken');
      redirectToLogin();
    }

    function formatDate(isoString) {
      try {
        const date = new Date(isoString);
        return date.toLocaleString('en-US', {
          year: 'numeric',
          month: 'short',
          day: '2-digit',
          hour: '2-digit',
          minute: '2-digit',
          second: '2-digit',
          hour12: true
        });
      } catch (error) {
        return 'N/A';
      }
    }

    async function loadUsers() {
      try {
        const response = await fetch('/api/users', {
          headers: {
            'Authorization': `Bearer ${authToken}`
          }
        });

        if (response.status === 401) {
          logout();
          return;
        }

        const users = await response.json();
        document.getElementById('loading').style.display = 'none';
        const userTable = document.getElementById('userTable');
        userTable.innerHTML = '';

        users.forEach(user => {
          const row = document.createElement('tr');
          row.innerHTML = `
            <td>
              ${user.profileImage ? 
                `<img class="profile-img" src="${user.profileImage}" alt="${user.firstName}'s profile">` : 
                'N/A'}
            </td>
            <td>${user.firstName}</td>
            <td>${user.lastName || '-'}</td>
            <td>${user.CNICNo || '-'}</td>
            <td><a href="mailto:${user.email}">${user.email}</a></td>
            <td>${user.role}</td>
            <td class="timestamp">${formatDate(user.createdAt)}</td>
            <td>
              <button class="btn-primary" onclick="openPasswordModal('${user.id}')">
                Change Password
              </button>
            </td>
          `;
          userTable.appendChild(row);
        });
      } catch (error) {
        console.error('Error:', error);
        document.getElementById('loading').textContent = 'Error loading users';
      }
    }

    function openPasswordModal(userId) {
      currentUserId = userId;
      document.getElementById('passwordModal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('passwordModal').style.display = 'none';
      resetForm();
    }

    function resetForm() {
      document.getElementById('passwordForm').reset();
      document.getElementById('errorMessage').textContent = '';
    }

    document.getElementById('passwordForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const newPassword = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      const adminPassword = document.getElementById('adminPassword').value;
      const errorMessage = document.getElementById('errorMessage');

      errorMessage.textContent = '';

      // Validation
      if (newPassword !== confirmPassword) {
        errorMessage.textContent = 'Passwords do not match!';
        return;
      }
      if (newPassword.length < 8) {
        errorMessage.textContent = 'Password must be at least 8 characters!';
        return;
      }

      try {
        const response = await fetch(`/api/users/${currentUserId}/password`, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${authToken}`
          },
          body: JSON.stringify({
            newPassword,
            adminPassword
          })
        });

        if (response.status === 401) {
          logout();
          return;
        }

        const data = await response.json();
        
        if (!response.ok) {
          throw new Error(data.message || 'Failed to change password');
        }

        alert('Password changed successfully!');
        closeModal();
      } catch (error) {
        errorMessage.textContent = error.message;
      }
    });

    // Initial load and auto-refresh
    loadUsers();
    setInterval(loadUsers, 60000);
  </script>
</body>
</html>
